name: Publish Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/atwhuhu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-fusion-video/pom.xml

      - name: Build backend JAR
        working-directory: ./ai-fusion-video
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests -B

      - name: Prepare backend Docker context
        working-directory: ./ai-fusion-video
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No packaged backend jar found"
            exit 1
          fi
          mkdir -p docker-build
          cp "$JAR_PATH" docker-build/app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 后端 ----------
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./ai-fusion-video/docker-build
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/atwhuhu/ai-fusion-video:latest
            ghcr.io/atwhuhu/ai-fusion-video:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------- 前端 ----------
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ai-fusion-video-web
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/atwhuhu/ai-fusion-video-web:latest
            ghcr.io/atwhuhu/ai-fusion-video-web:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
